name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          node -e '
            for (const packageName of ["dsh-zephyr", "dsh-accounts"]) {
              const { name, version } = require(`./packages/${packageName}/package.json`)
              if (name !== `@liyang8246/${packageName}` || `v${version}` !== process.env.GITHUB_REF_NAME) process.exit(1)
            }
          '
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Publish Zephyr
        working-directory: packages/dsh-zephyr
        run: npm publish --provenance --access public
      - name: Publish Accounts
        working-directory: packages/dsh-accounts
        run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          name: '${{ github.ref_name }}'
          generate_release_notes: true
