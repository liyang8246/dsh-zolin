name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: dsh-codetime
        type: choice
        options:
          - dsh-codetime
          - dsh-zephyr
          - dsh-accounts
          - all

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          node -e '
            for (const packageName of ["dsh-zephyr", "dsh-accounts", "dsh-codetime"]) {
              const { name, version } = require(`./packages/${packageName}/package.json`)
              if (name !== `@liyang8246/${packageName}` || `v${version}` !== process.env.GITHUB_REF_NAME) process.exit(1)
            }
          '
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Publish Zephyr
        if: github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'dsh-zephyr'
        working-directory: packages/dsh-zephyr
        run: npm publish --provenance --access public
      - name: Publish Accounts
        if: github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'dsh-accounts'
        working-directory: packages/dsh-accounts
        run: npm publish --provenance --access public
      - name: Publish CodeTime
        if: github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'dsh-codetime'
        working-directory: packages/dsh-codetime
        run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          name: '${{ github.ref_name }}'
          generate_release_notes: true
